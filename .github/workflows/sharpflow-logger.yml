# Logs SharpFlow (NHL Savant) MCP tickets and locks to the `sharpflow` branch. No Claude usage.
# Scheduled pulls are RETIRED (Nov 18) - SF_URL is dead now that the account moved to the
# authenticated NHL_Savant_-_Sharp_Flow MCP connector, which GitHub Actions can't reach.
# A Claude scheduled task ("SharpFlow MCP puller + watchdog") now does the pull+push instead.
# This workflow is kept dispatch-only, for manual Discord test posts and as a connectivity probe.
name: SharpFlow logger
on:
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Post flags to Discord now, old format (test)'
        required: false
        default: 'no'
      force_post_v2:
        description: 'Post flags to Discord now, new format with wallet/momentum checks (test)'
        required: false
        default: 'no'
      post_cards:
        description: 'Post pre-rendered card images from cards/<date>/ to Discord (yes/no)'
        required: false
        default: 'no'
      card_date:
        description: 'Date folder under cards/ to post (YYYY-MM-DD), defaults to today'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: sharpflow-logger
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare sharpflow branch
        run: |
          mkdir sf_branch && cd sf_branch && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 20 origin sharpflow; then git checkout -q -B sharpflow FETCH_HEAD; else git checkout -q --orphan sharpflow; fi
      - name: Pull SharpFlow
        env:
          SF_URL: ${{ vars.SF_URL }}
        run: node scripts/sharpflow_logger.js
      - name: Post flags to Discord (Mon, Thu, Sat, Sun after the 10am and 4pm pulls)
        continue-on-error: true
        env:
          HOOK_SIGNALS: ${{ secrets.DISCORD_SIGNALS }}
          FORCE: ${{ github.event.inputs.force_post == 'yes' && '1' || '0' }}
        run: node scripts/sharpflow_discord.js
      - name: Post flags to Discord, v2 format with checks (manual test only)
        if: github.event.inputs.force_post_v2 == 'yes'
        continue-on-error: true
        env:
          HOOK_SIGNALS: ${{ secrets.DISCORD_SIGNALS }}
          FORCE: '1'
        run: node scripts/sharpflow_discord_v2.js
      - name: Post card images to Discord (manual, from cards/<date>/)
        if: github.event.inputs.post_cards == 'yes'
        continue-on-error: true
        env:
          HOOK_SIGNALS: ${{ secrets.DISCORD_SIGNALS }}
          CARD_DATE: ${{ github.event.inputs.card_date }}
        run: node scripts/sharpflow_discord_cards.js
      - name: Publish
        run: |
          cd sf_branch
          git config user.name "sharpflow-logger"; git config user.email "sharpflow-logger@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "sharpflow $(date -u +%F-%H%M)"
          git push -q origin sharpflow || { git pull -q --rebase origin sharpflow && git push -q origin sharpflow; }
