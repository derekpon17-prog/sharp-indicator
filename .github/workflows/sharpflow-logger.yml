# Logs SharpFlow (NHL Savant) MCP tickets and locks to the `sharpflow` branch. No Claude usage.
name: SharpFlow logger
on:
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Post flags to Discord now (test)'
        required: false
        default: 'no'
  schedule:
    - cron: '7,37 16,20,22 * * *'   # 10:07am, 2:07pm, 4:07pm CT (+ :37 backups)
    - cron: '7,37 0 * * *'          # 6:07pm CT
permissions:
  contents: write
concurrency:
  group: sharpflow-logger
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare sharpflow branch
        run: |
          mkdir sf_branch && cd sf_branch && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 20 origin sharpflow; then git checkout -q -B sharpflow FETCH_HEAD; else git checkout -q --orphan sharpflow; fi
      - name: Pull SharpFlow
        env:
          SF_URL: ${{ vars.SF_URL }}
        run: node scripts/sharpflow_logger.js
      - name: Post flags to Discord (Mon, Thu, Sat, Sun after the 10am and 4pm pulls)
        continue-on-error: true
        env:
          HOOK_SIGNALS: ${{ secrets.DISCORD_SIGNALS }}
          FORCE: ${{ github.event.inputs.force_post == 'yes' && '1' || '0' }}
        run: node scripts/sharpflow_discord.js
      - name: Publish
        run: |
          cd sf_branch
          git config user.name "sharpflow-logger"; git config user.email "sharpflow-logger@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "sharpflow $(date -u +%F-%H%M)"
          git push -q origin sharpflow || { git pull -q --rebase origin sharpflow && git push -q origin sharpflow; }
