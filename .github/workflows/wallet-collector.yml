# Daily Polymarket wallet vetting per sport. No Claude usage. Writes wallets/wallets.json to the `wallets` branch.
name: Wallet collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
concurrency:
  group: wallet-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and vet wallets
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/wallet_collector.js
      - name: Publish to wallets branch
        run: |
          git config user.name "wallet-collector"
          git config user.email "wallet-collector@users.noreply.github.com"
          cp -r wallets /tmp/wallets_out
          git checkout --orphan wallets-new
          git rm -rf -q . 
          mkdir -p wallets && cp /tmp/wallets_out/wallets.json wallets/
          git add wallets
          git commit -q -m "wallets $(date -u +%F)"
          git push -f origin wallets-new:wallets
