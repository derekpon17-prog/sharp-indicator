# Polymarket wallet vetting per sport, every 4h (was once/day). No Claude usage. Writes wallets/wallets.json to the `wallets` branch.
# Each run recomputes the pre/post cutoff off the current time, so grading recalibrates every run, not just daily.
name: Wallet collector
on:
  workflow_dispatch:
  # PAUSED (Derek, Nov 24 2026: rely on Sharp Flow only). Schedules removed; manual dispatch still works.
  # Was: cron '17 */4 * * *' and '50 14,15,18,20,22 * * *'.
permissions:
  contents: write
concurrency:
  group: wallet-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and vet wallets
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          node scripts/probe_v2.js || true
          node scripts/wallet_collector.js
      - name: Publish to wallets branch
        run: |
          git config user.name "wallet-collector"
          git config user.email "wallet-collector@users.noreply.github.com"
          cp -r wallets /tmp/wallets_out
          git checkout --orphan wallets-new
          git rm -rf -q . 
          mkdir -p wallets && cp /tmp/wallets_out/*.json wallets/
          git add wallets
          git commit -q -m "wallets $(date -u +%F)"
          git push -f origin wallets-new:wallets
