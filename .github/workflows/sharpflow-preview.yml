# Sharp Flow preview: one Discord card per sport about 60 minutes before that sport's first game of the day (CT). No Claude usage.
# Checks ESPN for each sport's first start; only when a sport is due does it read the latest SharpFlow snapshot
# (sharpflow branch, kept fresh by the "SharpFlow MCP puller" scheduled task - this workflow no longer pulls data itself),
# build the board card (scripts/sharpflow_preview.js), push it to the `outbox` branch and trigger "Discord outbox" to post it.
# Dispatch-only - see 2026-11-18 note below.
name: SharpFlow preview
on:
  workflow_dispatch:
    inputs:
      force_sports:
        description: 'Test: build cards now for these sports (e.g. NBA,NHL) ignoring the time window'
        required: false
        default: ''
      dry_run:
        description: 'yes = build the card and show it in the log, do not post and do not mark as posted'
        required: false
        default: 'no'
  # Schedule back on Nov 20 2026 (council): the data comes from the SharpFlow MCP puller scheduled task, which also
  # dispatches this workflow after each push; this cron is the backup so a dropped dispatch only costs 20 minutes.
  # Every 20 min, 8:00am-11:59pm CT (UTC 14-23 and 0-5; CST = UTC-6). Public repo, so Actions minutes are free.
  schedule:
    - cron: '7,27,47 14-23,0-5 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: sharpflow-logger
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare sharpflow branch
        run: |
          mkdir sf_branch && cd sf_branch && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 20 origin sharpflow; then git checkout -q -B sharpflow FETCH_HEAD; else git checkout -q --orphan sharpflow; fi
      - name: Polymarket wallet matches (Derek, Nov 20 2026)
        # Classified Polymarket wallets (wallets branch, wallets.json HOT/COLD per sport) that bought a side of a game
        # on today's SharpFlow snapshot -> sf_branch/poly_matches.json. Read by the card build below and by the
        # Sharp Signals window tasks for the slate card. Never fails the run: on any error the file records it.
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin wallets && git show FETCH_HEAD:wallets/wallets.json > wallets.json || echo '{}' > wallets.json
          # previous run's matches, for the late-money alert below
          cp sf_branch/poly_matches.json poly_prev.json 2>/dev/null || true
          node scripts/poly_match.js sf_branch wallets.json sf_branch/poly_matches.json
          # Grade logged Poly calls whose games have finished, rebuild sf_branch/poly_record.json (running record).
          node scripts/poly_grade.js sf_branch || true
      - name: Which sports are due
        id: plan
        env:
          MODE: plan
        run: node scripts/sharpflow_preview.js
      - name: Decide
        id: go
        run: |
          DUE="${{ github.event.inputs.force_sports }}"
          [ -z "$DUE" ] && DUE="${{ steps.plan.outputs.due }}"
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
      - name: Build cards
        if: steps.go.outputs.due != ''
        env:
          MODE: build
          DUE: ${{ steps.go.outputs.due }}
          NO_MARK: ${{ (github.event.inputs.dry_run == 'yes' || github.event.inputs.force_sports != '') && '1' || '' }}
        run: |
          node scripts/sharpflow_preview.js
          for f in cards/*.json; do [ -f "$f" ] && { echo "== $f"; head -c 3000 "$f"; echo; }; done; true
      - name: Polymarket late money (HOT wallet new or doubled after the sport's report posted)
        continue-on-error: true
        env:
          NO_MARK: ${{ github.event.inputs.dry_run == 'yes' && '1' || '' }}
        run: |
          node scripts/poly_alert.js sf_branch poly_prev.json cards
          for f in cards/*polylate*.json; do [ -f "$f" ] && { echo "== $f"; head -c 2000 "$f"; echo; }; done; true
      - name: Watchdog (missed cards, stale SharpFlow snapshot)
        if: always()
        env:
          MODE: watch
          NO_MARK: ${{ github.event.inputs.dry_run == 'yes' && '1' || '' }}
        run: node scripts/sharpflow_preview.js
      - name: Publish sharpflow branch (snapshot + posted marker + poly_matches.json)
        # Runs every time now (not only when a card was due) so poly_matches.json stays fresh for the window tasks.
        if: always() && github.event.inputs.dry_run != 'yes'
        run: |
          cd sf_branch
          git config user.name "sharpflow-logger"; git config user.email "sharpflow-logger@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "sharpflow preview $(date -u +%F-%H%M)"
          git push -q origin sharpflow || { git pull -q --rebase origin sharpflow && git push -q origin sharpflow; }
      - name: Send cards to Discord outbox
        if: always() && github.event.inputs.dry_run != 'yes'
        run: |
          ls cards/*.json >/dev/null 2>&1 || { echo "no cards to send"; exit 0; }
          git clone -q --depth 1 -b outbox "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ob
          cp cards/*.json ob/outbox/
          cd ob
          git config user.name "sharpflow-preview"; git config user.email "sharpflow-preview@users.noreply.github.com"
          git add outbox
          git commit -q -m "Sharp Flow preview cards"
          git push -q origin outbox || { git pull -q --rebase origin outbox && git push -q origin outbox; }
          gh workflow run discord-outbox.yml --ref outbox -R "${{ github.repository }}"
