# One-off API probe (temporary, Nov 20 2026) - finds how Polymarket tags college basketball games.
name: API probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          G=https://gamma-api.polymarket.com
          for t in cbb ncaab college-basketball ncaa-basketball ncaa-cbb mens-college-basketball basketball ncaam; do
            n=$(curl -s "$G/events?tag_slug=$t&closed=false&limit=100" | jq 'length'); c=$(curl -s "$G/events?tag_slug=$t&closed=true&order=endDate&ascending=false&limit=100" | jq '[.[]|select(.slug|startswith("cbb"))]|length')
            echo "tag $t open=$n closed_cbb_slugs=$c"
          done
          echo "--- tags matching"; curl -s "$G/tags?limit=1000" | jq -r '.[]|select((.slug|test("bask|cbb|ncaa|college";"i")))|"\(.id) \(.slug) \(.label)"' | head -30
          echo "--- sample cbb event from trades feed"; curl -s "https://data-api.polymarket.com/v2/trades?limit=500" | jq -r '.data[]|select((.slug // .event_slug // "")|startswith("cbb"))|"\(.event_slug) \(.slug) \(.title)"' | head -5
          S=$(curl -s "https://data-api.polymarket.com/v2/trades?limit=1000" | jq -r '[.data[]|select((.event_slug // "")|startswith("cbb"))][0].event_slug'); echo "event slug $S"
          [ "$S" != "null" ] && curl -s "$G/events?slug=$S" | jq '.[0]|{id,slug,title,endDate,closed,series:[.series[]?|{id,slug}],tags:[.tags[]?|{id,slug}]}'
          echo "--- series 10012"; curl -s "$G/series?id=10012" | jq '.[0]|{id,slug,title}' ; curl -s "$G/events?series_id=10012&limit=3&order=endDate&ascending=false" | jq '[.[]|{slug,endDate,closed}]'
