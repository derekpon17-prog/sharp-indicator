# One-off API probe (temporary, Nov 20 2026) - finds how Polymarket tags college basketball games.
name: API probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          G=https://gamma-api.polymarket.com
          for t in cbb ncaab college-basketball ncaa-basketball mens-college-basketball ncaam; do
            o=$(curl -s "$G/events?tag_slug=$t&closed=false&limit=100" | jq -r 'if type=="array" then (length|tostring) + " e.g. " + ((.[0].slug)//"-") else "ERR" end')
            c=$(curl -s "$G/events?tag_slug=$t&closed=true&order=endDate&ascending=false&limit=100" | jq -r 'if type=="array" then (length|tostring) + " e.g. " + ((.[0].slug)//"-") else "ERR" end')
            echo "tag $t | open $o | closed $c"
          done
          S=$(curl -s "https://data-api.polymarket.com/v2/trades?limit=1000&filter_type=CASH&filter_amount=50" | jq -r '[.data[]|select(((.event_slug // .slug) // "")|startswith("cbb"))][0]|(.event_slug // .slug)')
          echo "cbb event slug from feed: $S"
          curl -s "$G/events?slug=$S" | jq -c '.[0]|{id,slug,title,endDate,closed,series:[.series[]?|{id,slug}],tags:[.tags[]?|{id,slug}]}'
          echo "series 10012:"; curl -s "$G/events?series_id=10012&limit=3&order=endDate&ascending=false" | jq -c '[.[]?|{slug,endDate,closed}]'
