name: PM probe (temp)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe gamma-api tags and trade slugs
        run: |
          echo "---gamma-api events by tag=nfl---"
          curl -sS "https://gamma-api.polymarket.com/events?tag_slug=nfl&closed=false&limit=5" | head -c 1500
          echo
          echo "---gamma-api events by tag=nba---"
          curl -sS "https://gamma-api.polymarket.com/events?tag_slug=nba&closed=false&limit=5" | head -c 1500
          echo
          echo "---gamma-api tags list search sports---"
          curl -sS "https://gamma-api.polymarket.com/tags?limit=100" | head -c 3000
          echo
          echo "---large trades sample for slug patterns---"
          curl -sS "https://data-api.polymarket.com/v2/trades?limit=100" > /tmp/trades.json
          python3 -c "
import json
d=json.load(open('/tmp/trades.json'))
rows = d if isinstance(d, list) else d.get('data', d)
seen=set()
for t in rows:
    s = t.get('event_slug') or t.get('slug')
    if s and s not in seen:
        seen.add(s)
        print(s, '|', t.get('title'))
" 2>&1 | head -60
