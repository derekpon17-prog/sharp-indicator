name: PM probe tonight (temp)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch current wallets.json from wallets branch
        run: git show origin/wallets:wallets/wallets.json > wallets.json
      - name: Run matcher
        run: node scripts/pm_tonight_probe_temp.js
      - name: Show output
        run: cat tonight_hits.json | head -c 6000
