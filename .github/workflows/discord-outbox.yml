# Posts NFL props and Sharp Signals cards from outbox/ to Derek's Discord, then moves them to sent/.
# Scheduled Claude runs only commit a card file to the `outbox` branch; this workflow does the posting.
# Webhooks live only in repo secrets DISCORD_NFLPROPS, DISCORD_SIGNALS and DISCORD_PROPS. Pause posting by disabling this workflow.
name: Discord outbox
on:
  push:
    branches: [outbox]
    paths: ['outbox/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discord-outbox
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install card renderer (only when a card has scorecards)
        run: |
          if grep -lq '"scorecards"' outbox/*.json 2>/dev/null; then
            pip install --quiet playwright
            python3 -m playwright install --with-deps chromium
          fi
      - name: Post cards
        env:
          HOOK: ${{ secrets.DISCORD_NFLPROPS }}
          HOOK_SIGNALS: ${{ secrets.DISCORD_SIGNALS }}
          HOOK_PROPS: ${{ secrets.DISCORD_PROPS }}
        run: python3 .github/scripts/post_outbox.py
      - name: Move posted cards to sent/
        if: always()
        run: |
          git config user.name "discord-outbox"
          git config user.email "discord-outbox@users.noreply.github.com"
          git add -A outbox sent
          git diff --cached --quiet || (git commit -m "Posted outbox cards [skip ci]" && git push)
