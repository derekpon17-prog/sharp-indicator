# Sharp Flow live alerts: reads the latest SharpFlow snapshot (sharpflow branch, kept fresh by the "SharpFlow MCP puller"
# scheduled task - this workflow no longer pulls data itself) and posts any NEW or GROWN sharp side ($1K+, positive-ROI
# wallets only) to Discord. First run of each CT day records the board silently; the pre-game cards already cover it.
# No Claude usage. Dispatch-only - see 2026-11-18 note below.
name: SharpFlow alerts
on:
  workflow_dispatch:
  # Schedule back on Nov 20 2026 (council): backup to the puller's dispatch, every 20 min 8:00am-11:59pm CT.
  schedule:
    - cron: '12,32,52 14-23,0-5 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: sharpflow-logger
  cancel-in-progress: false
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare sharpflow branch
        run: |
          mkdir sf_branch && cd sf_branch && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 20 origin sharpflow; then git checkout -q -B sharpflow FETCH_HEAD; else git checkout -q --orphan sharpflow; fi
      - name: Posted plays (so an alert can say WITH or AGAINST a play we already posted)
        run: |
          git clone -q --depth 1 -b outbox "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ob_read || mkdir -p ob_read
          python3 scripts/posted_plays.py ob_read "$(TZ=America/Chicago date +%F)" posted_plays.json || echo '[]' > posted_plays.json
      - name: Wallet names (public Polymarket names for the 6-character wallet ids)
        continue-on-error: true
        run: node scripts/fetch_wallet_names.js wallet_names.json
      - name: Build alerts
        id: alerts
        run: node scripts/sharpflow_alerts.js
      - name: Site lock gap alert (locks on the Sharp Flow site that no card of ours has)
        id: locks
        run: |
          git clone -q --depth 1 -b outbox "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ob_read || mkdir -p ob_read
          node scripts/site_lock_alert.js sf_branch ob_read cards || echo "locks_wrote=0" >> "$GITHUB_OUTPUT"
      - name: Publish sharpflow branch
        run: |
          cd sf_branch
          git config user.name "sharpflow-logger"; git config user.email "sharpflow-logger@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "sharpflow alerts $(date -u +%F-%H%M)"
          git push -q origin sharpflow || { git pull -q --rebase origin sharpflow && git push -q origin sharpflow; }
      - name: Send alert card to Discord outbox
        if: (steps.alerts.outputs.wrote != '' && steps.alerts.outputs.wrote != '0') || steps.locks.outputs.locks_wrote == '1'
        run: |
          git clone -q --depth 1 -b outbox "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ob
          cp cards/*.json ob/outbox/
          cd ob
          git config user.name "sharpflow-alerts"; git config user.email "sharpflow-alerts@users.noreply.github.com"
          git add outbox
          git commit -q -m "Sharp Flow alert"
          git push -q origin outbox || { git pull -q --rebase origin outbox && git push -q origin outbox; }
          gh workflow run discord-outbox.yml --ref outbox -R "${{ github.repository }}"
